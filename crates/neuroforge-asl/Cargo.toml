[package]
name    = "neuroforge-asl"
version = "4.1.0"
edition = "2021"

[lib]
name = "neuroforge_core"
crate-type = ["cdylib", "rlib"]


[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
regex       = "1"
pyo3        = { version = "0.20", features = ["extension-module"] }
neuroforge-sim = { path = "../neuroforge-sim" }


# ── Tree-sitter core ─────────────────────────────────────────────────────────
tree-sitter         = "0.26.3"

# ── Language grammars ────────────────────────────────────────────────────────
tree-sitter-c       = "0.24.1"
tree-sitter-cpp     = "0.23.4"
tree-sitter-python  = "0.25.0"
tree-sitter-rust    = "0.24.0"
tree-sitter-arduino = "0.24.0"
tree-sitter-xml     = "0.7.0"

# ── Compat. explícita ─────────────────────────────────────────────────────────
tree-sitter-language = "0.1.7"

# ── PLC / Structured Text (IEC 61131-3) ──────────────────────────────────────
iec61131            = "0.7.0"

# ── PLC Multi-Language (IL / LD / FBD / SFC) ────────────────────────────────
pest        = "2"
pest_derive = "2"
quick-xml   = { version = "0.39.2", features = ["serialize", "overlapped-lists"] }
plcopen     = "0.3.1"

# ── Schema + versionamento ────────────────────────────────────────────────────
semver    = { version = "1", features = ["serde"] }
uuid      = { version = "1", features = ["v4", "js"] }
roxmltree = "0.19"

# ── TOON serialization (for deterministic hashing) ────────────────────────────
serde_toon = "0.2"
serde_yaml = "0.9"

# ── Runtime async — feature-flagged para não puxar tokio no WASM ─────────────
tokio = { version = "1", features = ["rt", "time"], optional = true }

[features]
default = ["native"]
native  = ["tokio"]
experimental-asm = []

[dev-dependencies]
serde_json = { workspace = true }

