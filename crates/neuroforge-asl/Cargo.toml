[package]
name    = "neuroforge-asl"
version = "4.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
wasm-bindgen = "0.2"

# ── Tree-sitter core ─────────────────────────────────────────────────────────
# API 0.24+: usar LANGUAGE constante estática (não language() função)
# Exemplo: parser.set_language(&tree_sitter_arduino::LANGUAGE.into()).unwrap();
tree-sitter         = "0.26.3"

# ── Language grammars ────────────────────────────────────────────────────────
tree-sitter-c       = "0.24.1"
tree-sitter-cpp     = "0.23.4"
tree-sitter-python  = "0.25.0"
tree-sitter-rust    = "0.24.0"
tree-sitter-arduino = "0.24.0"
tree-sitter-xml     = "0.7.0"

# ── PLC / Structured Text (IEC 61131-3) ──────────────────────────────────────
# iecst está deprecated — usar iec61131 (mais completo, cobertura OOP IEC 61131-3:2013)
iec61131            = "0.1"

# ── Compat. explícita (evita conflito tree-sitter-cpp 0.23 <> core 0.26) ─────
tree-sitter-language = "0.1.7"

[dev-dependencies]
serde_json = { workspace = true }
