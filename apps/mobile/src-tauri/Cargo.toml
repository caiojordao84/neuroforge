[package]
name    = "neuroforge-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "neuroforge_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
serde          = { workspace = true }
serde_json     = { workspace = true }
neuroforge-asl = { path = "../../../crates/neuroforge-asl" }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
