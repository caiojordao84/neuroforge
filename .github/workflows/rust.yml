name: Rust CI

on:
  push:
    branches: [preRust, main]
  pull_request:
    branches: [preRust, main]

jobs:
  test:
    name: check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (workspace)
        run: cargo check --workspace

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test (neuroforge-asl)
        run: cargo test -p neuroforge-asl

  wasm:
    name: WASM build + size check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup wasi-sdk (sysroot for tree-sitter grammars)
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-25.0-x86_64-linux.tar.gz
          sudo mv wasi-sdk-25.0 /opt/wasi-sdk

      - name: Cache cargo registry (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-wasm-

      - name: Build WASM bundle
        env:
          CC: /opt/wasi-sdk/bin/clang
          AR: /opt/wasi-sdk/bin/llvm-ar
          NM: /opt/wasi-sdk/bin/llvm-nm
          STRIP: /opt/wasi-sdk/bin/llvm-strip
          RANLIB: /opt/wasi-sdk/bin/llvm-ranlib
          CFLAGS: "--target=wasm32-unknown-unknown --sysroot=/opt/wasi-sdk/share/wasi-sysroot"
        run: |
          cd crates/neuroforge-asl
          wasm-pack build --target web --out-dir ../../apps/webapp/src/lib/wasm

      - name: Check WASM bundle size (< 2 MB)
        run: |
          WASM_FILE="apps/webapp/src/lib/wasm/neuroforge_asl_bg.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "Error: $WASM_FILE not found!"
            exit 1
          fi
          SIZE=$(wc -c < "$WASM_FILE")
          echo "WASM size: ${SIZE} bytes"
          if [ "$SIZE" -ge 2097152 ]; then
            echo "WASM bundle excede 2 MB!"
            exit 1
          fi

      - name: Upload WASM bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroforge-asl-wasm
          path: apps/webapp/src/lib/wasm/
          retention-days: 7
