name: Rust CI

on:
  push:
    branches: [preRust, main]
  pull_request:
    branches: [preRust, main]

jobs:
  test:
    name: check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (crates)
        run: cargo check -p neuroforge-asl -p neuroforge-transport -p neuroforge-firmware

      - name: cargo clippy (crates)
        run: cargo clippy -p neuroforge-asl -p neuroforge-transport -p neuroforge-firmware -- -D warnings

      - name: cargo test (neuroforge-asl)
        run: cargo test -p neuroforge-asl

  wasm:
    name: WASM build + size check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup wasi-sdk (sysroot for tree-sitter grammars)
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          DIR_NAME=$(tar -tzf wasi-sdk-25.0-x86_64-linux.tar.gz | head -1 | cut -f1 -d"/")
          tar -xzf wasi-sdk-25.0-x86_64-linux.tar.gz
          sudo mv "$DIR_NAME" /opt/wasi-sdk

      - name: Cache cargo registry (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-wasm-

      - name: Build WASM bundle
        env:
          CC_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang
          AR_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ar
          NM_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-nm
          STRIP_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-strip
          RANLIB_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ranlib
          CFLAGS_wasm32_unknown_unknown: "--target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot"
        run: |
          cd crates/neuroforge-asl
          wasm-pack build --target web --out-dir ../../apps/webapp/src/lib/wasm

      - name: Check WASM bundle size (< 10 MB)
        run: |
          WASM_FILE="apps/webapp/src/lib/wasm/neuroforge_asl_bg.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "Error: $WASM_FILE not found!"
            exit 1
          fi
          SIZE=$(wc -c < "$WASM_FILE")
          echo "WASM size: ${SIZE} bytes"
          if [ "$SIZE" -ge 10485760 ]; then
            echo "WASM bundle exceeds 10 MB!"
            exit 1
          fi

      - name: Upload WASM bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroforge-asl-wasm
          path: apps/webapp/src/lib/wasm/
          retention-days: 7
