  <circle id="anchor-gnd" class="signal-anchor signal-gnd" data-signal="gnd" data-signal-type="power" data-direction="input" cx="90" cy="40" r="4"/>
  <rect x="20" y="10" width="60" height="40" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <rect x="25" y="15" width="25" height="30" rx="2" fill="#34495e"/>
  <circle cx="37" cy="30" r="8" fill="#f39c12"/>
  <text x="55" y="23" font-family="Arial" font-size="6" font-weight="bold" fill="#2c3e50">RELAY</text>
  <text x="55" y="35" font-family="Arial" font-size="5" fill="#7f8c8d">5V Module</text>
  <circle cx="75" cy="25" r="3" fill="#27ae60"/>
  <line x1="10" y1="30" x2="20" y2="30" stroke="#333" stroke-width="2"/>
