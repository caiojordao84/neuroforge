<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <defs>
    <style>
      .signal-anchor { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .signal-anchor:hover { fill: #4a90d9; }
      .signal-digital { stroke: #333; }
      .signal-pwm { stroke: #e67e22; }
      .signal-analog { stroke: #27ae60; }
      .signal-power { stroke: #e74c3c; }
      .signal-gnd { stroke: #2c3e50; }
    </style>
  </defs>
  <circle id="anchor-trig" class="signal-anchor signal-digital" data-signal="trig" data-signal-type="digital" data-direction="output" cx="10" cy="20" r="4"/>
  <circle id="anchor-echo" class="signal-anchor signal-digital" data-signal="echo" data-signal-type="digital" data-direction="input" cx="10" cy="40" r="4"/>
  <circle id="anchor-vcc" class="signal-anchor signal-power" data-signal="vcc" data-signal-type="power" data-direction="input" cx="90" cy="20" r="4"/>
  <circle id="anchor-gnd" class="signal-anchor signal-gnd" data-signal="gnd" data-signal-type="power" data-direction="input" cx="90" cy="40" r="4"/>
  <rect x="20" y="10" width="60" height="40" rx="3" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <ellipse cx="35" cy="30" rx="8" ry="10" fill="#34495e" stroke="#7f8c8d" stroke-width="1"/>
  <rect x="55" y="15" width="15" height="10" rx="1" fill="#95a5a6"/>
  <rect x="55" y="35" width="15" height="10" rx="1" fill="#95a5a6"/>
  <text x="40" y="34" font-family="Arial" font-size="7" fill="#ecf0f1">US</text>
  <line x1="10" y1="20" x2="20" y2="20" stroke="#333" stroke-width="2"/>
  <line x1="10" y1="40" x2="20" y2="40" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="20" x2="90" y2="20" stroke="#e74c3c" stroke-width="2"/>
  <line x1="80" y1="40" x2="90" y2="40" stroke="#2c3e50" stroke-width="2"/>
</svg>