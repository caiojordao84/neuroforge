<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <defs>
    <style>
      .signal-anchor { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .signal-anchor:hover { fill: #4a90d9; }
      .signal-digital { stroke: #333; }
      .signal-pwm { stroke: #e67e22; }
      .signal-analog { stroke: #27ae60; }
      .signal-power { stroke: #e74c3c; }
      .signal-gnd { stroke: #2c3e50; }
    </style>
  </defs>
  <circle id="anchor-red" class="signal-anchor signal-pwm" data-signal="red" data-signal-type="pwm" data-direction="input" cx="10" cy="20" r="4"/>
  <circle id="anchor-green" class="signal-anchor signal-pwm" data-signal="green" data-signal-type="pwm" data-direction="input" cx="10" cy="40" r="4"/>
  <circle id="anchor-blue" class="signal-anchor signal-pwm" data-signal="blue" data-signal-type="pwm" data-direction="input" cx="90" cy="20" r="4"/>
  <circle id="anchor-gnd" class="signal-anchor signal-gnd" data-signal="gnd" data-signal-type="power" data-direction="input" cx="90" cy="40" r="4"/>
  <rect x="30" y="10" width="40" height="40" rx="4" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
  <circle cx="50" cy="22" r="8" fill="#e74c3c" opacity="0.8"/>
  <circle cx="50" cy="38" r="8" fill="#27ae60" opacity="0.8"/>
  <circle cx="58" cy="22" r="8" fill="#3498db" opacity="0.8"/>
</svg>