<!DOCTYPE html>
<html>
<head>
    <title>DendriForge Dumb Client Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #e2e8f0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 30px;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:active {
            transform: scale(0.98);
        }
        button.stop {
            background-color: #ef4444;
        }
        button.stop:hover {
            background-color: #dc2626;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        #led-pin13 {
            width: 120px;
            height: 120px;
            background-color: #334155;
            margin: 30px auto;
            border-radius: 50%;
            border: 4px solid #475569;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: background-color 0.1s, box-shadow 0.1s;
        }
        #led-pin13.on {
            background-color: #ef4444;
            border-color: #f87171;
            box-shadow: 0 0 30px #ef4444, inset 0 0 15px rgba(255,255,255,0.6);
        }
        #log {
            font-family: monospace;
            background-color: #020617;
            color: #4ade80;
            padding: 15px;
            border-radius: 6px;
            font-size: 1.1rem;
            margin-top: 20px;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <h1>DendriForge Dumb Client</h1>
    <div class="container">
        <h3>Simulation Telemetry</h3>
        <button onclick="sendAction('start')">Start Sim (Rust)</button>
        <button class="stop" onclick="sendAction('stop')">Stop Sim</button>
        
        <div id="led-pin13" class="off"></div>
        
        <div id="log">Awaiting WebSocket Delta Stream...</div>
    </div>

    <script>
        const logElement = document.getElementById("log");
        const ledElement = document.getElementById("led-pin13");

        function sendAction(action) {
            fetch(`http://localhost:8001/sim/${action}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => console.log(`${action} response:`, data))
                .catch(err => console.error(`Error executing ${action}:`, err));
        }

        // Connect to FastAPI's WebSocket endpoint
        const ws = new WebSocket("ws://localhost:8001/sim/stream");

        
        ws.onopen = function() {
            logElement.innerText = "WebSocket Telemetry Channel Connected!";
            logElement.style.color = "#38bdf8";
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            logElement.innerText = `Tick Frame: ${data.tick}`;
            logElement.style.color = "#4ade80";
            
            // Dumb Client Logic: Read JSON payload and dynamically update visual elements
            if (data.deltas && data.deltas.length > 0) {
                const ledDelta = data.deltas[0];
                if (ledDelta && ledDelta.id === "led-pin13") {
                    ledElement.className = ledDelta.state === 1 ? "on" : "off";
                }
            }
        };

        ws.onclose = function() {
            logElement.innerText = "WebSocket Telemetry Channel Disconnected!";
            logElement.style.color = "#ef4444";
        };

        ws.onerror = function(err) {
            console.error("WebSocket Error:", err);
            logElement.innerText = "WebSocket Communication Error!";
            logElement.style.color = "#ef4444";
        };
    </script>
</body>
</html>
