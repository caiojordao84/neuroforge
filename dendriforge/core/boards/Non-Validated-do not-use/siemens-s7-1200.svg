<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- Siemens S7-1200 (Simulated) - Minimal Board Representation -->
  <style>
    .board { fill: #2d3748; stroke: #4a5568; stroke-width: 2; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #cbd5e0; }
    .title { font-family: Arial, sans-serif; font-size: 16px; fill: #ffffff; font-weight: bold; }
    .plc-input { fill: #48bb78; }
    .plc-output { fill: #f56565; }
    .io-label { font-family: monospace; font-size: 10px; fill: #ffffff; }
  </style>
  
  <!-- Board outline -->
  <rect x="15" y="15" width="320" height="250" rx="8" class="board"/>
  
  <!-- Title -->
  <text x="175" y="40" text-anchor="middle" class="title">Siemens S7-1200</text>
  <text x="175" y="58" text-anchor="middle" class="label">CPU 1214C | SIL-2</text>
  
  <!-- Digital Inputs (left side) -->
  <text x="25" y="85" class="label">I</text>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="100" r="7"/>
    <text x="48" y="103" class="io-label">I0.0</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="125" r="7"/>
    <text x="48" y="128" class="io-label">I0.1</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="150" r="7"/>
    <text x="48" y="153" class="io-label">I0.2</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="175" r="7"/>
    <text x="48" y="178" class="io-label">I0.3</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="200" r="7"/>
    <text x="48" y="203" class="io-label">I0.4</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="225" r="7"/>
    <text x="48" y="228" class="io-label">I0.5</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="240" r="7"/>
    <text x="48" y="243" class="io-label">I0.6</text>
  </g>
  <g data-io="input" class="plc-input">
    <circle cx="30" cy="255" r="7"/>
    <text x="48" y="258" class="io-label">I0.7</text>
  </g>
  
  <!-- Digital Outputs (right side) -->
  <text x="320" y="85" class="label">Q</text>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="100" r="7"/>
    <text x="290" y="103" class="io-label">Q0.0</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="125" r="7"/>
    <text x="290" y="128" class="io-label">Q0.1</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="150" r="7"/>
    <text x="290" y="153" class="io-label">Q0.2</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="175" r="7"/>
    <text x="290" y="178" class="io-label">Q0.3</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="200" r="7"/>
    <text x="290" y="203" class="io-label">Q0.4</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="225" r="7"/>
    <text x="290" y="228" class="io-label">Q0.5</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="240" r="7"/>
    <text x="290" y="243" class="io-label">Q0.6</text>
  </g>
  <g data-io="output" class="plc-output">
    <circle cx="320" cy="255" r="7"/>
    <text x="290" y="258" class="io-label">Q0.7</text>
  </g>
  
  <!-- Status indicators -->
  <circle cx="100" cy="235" r="6" fill="#48bb78"/>
  <text x="115" y="238" class="label">RUN</text>
  <circle cx="160" cy="235" r="6" fill="#f56565"/>
  <text x="175" y="238" class="label">ERR</text>
  <circle cx="220" cy="235" r="6" fill="#4299e1"/>
  <text x="235" y="238" class="label">PN</text>
</svg>