<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 350 700" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;">
    <defs>
        <style>
            .pin { fill: #2563eb; stroke: #1e40af; stroke-width: 0.5; }
            .pin-power { fill: #dc2626; stroke: #991b1b; stroke-width: 0.5; }
            .pin-ground { fill: #171717; stroke: #000; stroke-width: 0.5; }
            .pin-analog { fill: #ca8a04; stroke: #a16207; stroke-width: 0.5; }
            .pin-pwm { fill: #ea580c; stroke: #c2410c; stroke-width: 0.5; }
            .pin-i2c { fill: #16a34a; stroke: #15803d; stroke-width: 0.5; }
            .pin-spi { fill: #7c3aed; stroke: #5b21b6; stroke-width: 0.5; }
            .pin-dac { fill: #059669; stroke: #047857; stroke-width: 0.5; }
            .board-body { fill: #0ea5e9; }
            .board-label { fill: #fff; font-family: 'Roboto Mono', monospace; font-size: 14px; }
            .header-label { fill: #fff; font-family: 'Roboto', sans-serif; font-size: 10px; font-weight: bold; }
            .pin-label { fill: #fff; font-family: 'Roboto Mono', monospace; font-size: 6px; }
            .chip-label { fill: #fff; font-family: 'Roboto Mono', monospace; font-size: 8px; }
            .warning-text { fill: #dc2626; font-family: 'Roboto', sans-serif; font-size: 6px; }
        </style>
    </defs>

    <!-- BOARD BODY -->
    <g id="board">
        <rect class="board-body" x="20" y="20" width="310" height="660" rx="8"/>
        <text class="board-label" x="175" y="50" text-anchor="middle">Arduino MKR WiFi 1010</text>
    </g>

    <!-- USB CONNECTOR -->
    <g id="usb-connector">
        <rect x="135" y="5" width="80" height="25" fill="#374151" rx="2"/>
        <rect x="155" y="10" width="40" height="15" fill="#1f2937" rx="1"/>
    </g>

    <!-- SAMD21 CHIP -->
    <g id="samd21-chip">
        <rect x="105" y="80" width="140" height="80" fill="#1f2937" rx="4"/>
        <rect x="115" y="90" width="120" height="60" fill="#374151" rx="2"/>
        <text class="chip-label" x="175" y="125" text-anchor="middle">SAMD21</text>
    </g>

    <!-- NINA-W102 WiFi MODULE -->
    <g id="wifi-module">
        <rect x="105" y="180" width="140" height="60" fill="#1f2937" rx="4"/>
        <text class="chip-label" x="175" y="215" text-anchor="middle">NINA-W102</text>
    </g>

    <!-- LEFT HEADER - PINS (D0-D7 + Analog) -->
    <g id="header-left">
        <text x="50" y="90" class="header-label" text-anchor="middle">IO</text>

        <!-- D0 -->
        <circle id="pin-d0" class="pin" data-pin="0" data-interrupt="true" cx="50" cy="100" r="6"/>
        <text x="35" y="105" class="pin-label">D0</text>

        <!-- D1 -->
        <circle id="pin-d1" class="pin" data-pin="1" data-interrupt="true" cx="50" cy="130" r="6"/>
        <text x="35" y="135" class="pin-label">D1</text>

        <!-- D2 PWM -->
        <circle id="pin-d2" class="pin pin-pwm pin-dac" data-pin="2" data-pwm="true" data-interrupt="true" data-dac="true" cx="50" cy="160" r="6"/>
        <text x="35" y="165" class="pin-label">D2</text>

        <!-- D3 PWM -->
        <circle id="pin-d3" class="pin pin-pwm" data-pin="3" data-pwm="true" data-interrupt="true" cx="50" cy="190" r="6"/>
        <text x="35" y="195" class="pin-label">D3</text>

        <!-- D4 PWM -->
        <circle id="pin-d4" class="pin pin-pwm" data-pin="4" data-pwm="true" data-interrupt="true" cx="50" cy="220" r="6"/>
        <text x="35" y="225" class="pin-label">D4</text>

        <!-- D5 PWM -->
        <circle id="pin-d5" class="pin pin-pwm" data-pin="5" data-pwm="true" data-interrupt="true" cx="50" cy="250" r="6"/>
        <text x="35" y="255" class="pin-label">D5</text>

        <!-- D6 PWM -->
        <circle id="pin-d6" class="pin pin-pwm" data-pin="6" data-pwm="true" data-interrupt="true" cx="50" cy="280" r="6"/>
        <text x="35" y="285" class="pin-label">D6</text>

        <!-- D7 PWM -->
        <circle id="pin-d7" class="pin pin-pwm" data-pin="7" data-pwm="true" data-interrupt="true" cx="50" cy="310" r="6"/>
        <text x="35" y="315" class="pin-label">D7</text>

        <!-- A0 -->
        <circle id="pin-a0" class="pin pin-analog" data-pin="15" data-adc="true" cx="50" cy="340" r="6"/>
        <text x="35" y="345" class="pin-label">A0</text>

        <!-- A1 -->
        <circle id="pin-a1" class="pin pin-analog" data-pin="16" data-adc="true" cx="50" cy="370" r="6"/>
        <text x="35" y="375" class="pin-label">A1</text>

        <!-- A2 -->
        <circle id="pin-a2" class="pin pin-analog" data-pin="17" data-adc="true" cx="50" cy="400" r="6"/>
        <text x="35" y="405" class="pin-label">A2</text>

        <!-- A3 -->
        <circle id="pin-a3" class="pin pin-analog" data-pin="18" data-adc="true" cx="50" cy="430" r="6"/>
        <text x="35" y="435" class="pin-label">A3</text>

        <!-- A4 SDA -->
        <circle id="pin-a4" class="pin pin-analog pin-i2c" data-pin="19" data-adc="true" data-i2c="SDA" cx="50" cy="460" r="6"/>
        <text x="35" y="465" class="pin-label">SDA</text>

        <!-- A5 SCL -->
        <circle id="pin-a5" class="pin pin-analog pin-i2c" data-pin="20" data-adc="true" data-i2c="SCL" cx="50" cy="490" r="6"/>
        <text x="35" y="495" class="pin-label">SCL</text>

        <!-- GND1 -->
        <circle id="pin-gnd1" class="pin pin-ground" data-pin="GND" cx="50" cy="520" r="6"/>
        <text x="35" y="525" class="pin-label">GND</text>

        <!-- GND2 -->
        <circle id="pin-gnd2" class="pin pin-ground" data-pin="GND" cx="50" cy="550" r="6"/>
        <text x="35" y="555" class="pin-label">GND</text>

        <!-- AREF -->
        <circle id="pin-aref" class="pin" data-pin="AREF" cx="50" cy="580" r="6"/>
        <text x="35" y="585" class="pin-label">AREF</text>
    </g>

    <!-- RIGHT HEADER - PINS (D8-D14 + Power) -->
    <g id="header-right">
        <text x="300" y="90" class="header-label" text-anchor="middle">IO</text>

        <!-- D8 PWM -->
        <circle id="pin-d8" class="pin pin-pwm" data-pin="8" data-pwm="true" data-interrupt="true" cx="300" cy="100" r="6"/>
        <text x="315" y="105" class="pin-label">D8</text>

        <!-- D9 PWM -->
        <circle id="pin-d9" class="pin pin-pwm" data-pin="9" data-pwm="true" data-interrupt="true" cx="300" cy="130" r="6"/>
        <text x="315" y="135" class="pin-label">D9</text>

        <!-- D10 SS PWM -->
        <circle id="pin-d10" class="pin pin-pwm pin-spi" data-pin="10" data-pwm="true" data-interrupt="true" data-spi="SS" cx="300" cy="160" r="6"/>
        <text x="315" y="165" class="pin-label">SS</text>

        <!-- D11 MOSI PWM -->
        <circle id="pin-d11" class="pin pin-pwm pin-spi" data-pin="11" data-pwm="true" data-interrupt="true" data-spi="MOSI" cx="300" cy="190" r="6"/>
        <text x="315" y="195" class="pin-label">MOSI</text>

        <!-- D12 MISO -->
        <circle id="pin-d12" class="pin pin-spi" data-pin="12" data-interrupt="true" data-spi="MISO" cx="300" cy="220" r="6"/>
        <text x="315" y="225" class="pin-label">MISO</text>

        <!-- D13 SCK -->
        <circle id="pin-d13" class="pin pin-spi" data-pin="13" data-interrupt="true" data-spi="SCK" cx="300" cy="250" r="6"/>
        <text x="315" y="255" class="pin-label">SCK</text>

        <!-- D14 PWM -->
        <circle id="pin-d14" class="pin pin-pwm" data-pin="14" data-pwm="true" data-interrupt="true" cx="300" cy="280" r="6"/>
        <text x="315" y="285" class="pin-label">D14</text>

        <!-- VCC 3.3V -->
        <circle id="pin-vcc" class="pin pin-power" data-pin="VCC" data-voltage="3.3" cx="300" cy="310" r="6"/>
        <text x="315" y="315" class="pin-label">3V3</text>

        <!-- RESET -->
        <circle id="pin-rst" class="pin" data-pin="RESET" cx="300" cy="340" r="6"/>
        <text x="315" y="345" class="pin-label">RST</text>

        <!-- VIN -->
        <circle id="pin-vin" class="pin pin-power" data-pin="VIN" data-voltage="5.0" cx="300" cy="370" r="6"/>
        <text x="315" y="375" class="pin-label">VIN</text>

        <!-- GND3 -->
        <circle id="pin-gnd3" class="pin pin-ground" data-pin="GND" cx="300" cy="400" r="6"/>
        <text x="315" y="405" class="pin-label">GND</text>
    </g>

    <!-- LEDS -->
    <g id="leds">
        <circle id="led-power" fill="#16a34a" cx="60" cy="330" r="4"/>
        <text x="60" y="348" class="pin-label" text-anchor="middle">PWR</text>
        <circle id="led-wifi" fill="#2563eb" cx="90" cy="330" r="4"/>
        <text x="90" y="348" class="pin-label" text-anchor="middle">WiFi</text>
    </g>

    <!-- WARNINGS -->
    <g id="warnings">
        <text x="175" y="650" class="warning-text" text-anchor="middle">⚠ WiFi NINA-W102 occupies some GPIO</text>
    </g>

</svg>
