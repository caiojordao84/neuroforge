<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Digital Twin - S7-1200 LED Test</title>
    <link rel="stylesheet" href="dendriForge-A11Y-Slate.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #0f172a;
            font-family: 'Roboto', sans-serif;
            gap: 32px;
        }

        svg,
        object {
            width: 600px;
            height: auto;
            border-radius: 8px;
        }

        .control-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 380px;
        }

        .control-panel h3 {
            margin: 0;
            color: #f8fafc;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.85rem;
        }

        .btn-on {
            background-color: #10b981;
            color: #0f172a;
        }

        .btn-on:hover {
            background-color: #34d399;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .btn-on:active {
            transform: translateY(1px);
        }

        .btn-off {
            background-color: #f43f5e;
            color: #f8fafc;
        }

        .btn-off:hover {
            background-color: #fb7185;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
        }

        .btn-off:active {
            transform: translateY(1px);
        }

        .btn-demo {
            background-color: #3b82f6;
            color: #f8fafc;
        }

        .btn-demo:hover {
            background-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }

        .btn-demo:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <object id="board" data="siemens-s7-1200-cpu-1214c-corrigido.svg" type="image/svg+xml"></object>

    <div class="control-panel">
        <h3>Controle dos LEDs</h3>
        <div class="btn-group">
            <button id="btn-on" class="btn btn-on">ON</button>
            <button id="btn-off" class="btn btn-off">OFF</button>
            <button id="btn-demo" class="btn btn-demo">DEMO</button>
        </div>
    </div>
</body>

<script>
    // ─── Estado global ────────────────────────────────────────────────────────
    let svgDoc = null;
    const BOARD_LEDS = {};
    let blinkInterval = null;
    let activeTimeouts = [];
    let appMode = 'none'; // 'on' | 'off' | 'demo' | 'none'
    let svgClickHandler = null; // referência para remoção segura em reload


    // ─── Utilitários de LED ───────────────────────────────────────────────────

    function setLedState(ledId, state) {
        if (!svgDoc) return;
        const el = svgDoc.getElementById(ledId);
        if (!el) {
            console.warn(`LED '${ledId}' não encontrado`);
            return;
        }
        // Normaliza booleanos para string
        if (state === true) state = 'on';
        if (state === false) state = 'off';
        el.dataset.state = state;
    }


    // ─── Gestão de timeouts ───────────────────────────────────────────────────

    function clearAllTimeouts() {
        activeTimeouts.forEach(clearTimeout);
        activeTimeouts = [];
    }

    function registerTimeout(callback, delay) {
        const t = setTimeout(() => {
            callback();
            activeTimeouts = activeTimeouts.filter(x => x !== t);
        }, delay);
        activeTimeouts.push(t);
        return t;
    }


    // ─── Pulse ────────────────────────────────────────────────────────────────

    function pulseLed(ledId, durationMs = 500) {
        setLedState(ledId, 'on');
        registerTimeout(() => {
            // FIX #5 — só apaga se ainda estivermos no modo demo;
            // evita sobrepor estados definidos por ON/OFF enquanto timeouts pendentes disparam
            if (appMode === 'demo') {
                setLedState(ledId, 'off');
            }
        }, durationMs);
    }


    // ─── Demo ─────────────────────────────────────────────────────────────────

    function startDemo() {
        // FIX #3 — para tudo antes de recomeçar, evita race condition e duplo interval
        stopDemo();
        appMode = 'demo';

        const leds = Object.values(BOARD_LEDS);
        if (leds.length === 0) return;

        const runCycle = () => {
            leds.forEach((ledId, index) => {
                registerTimeout(() => {
                    if (appMode === 'demo') pulseLed(ledId, 500);
                }, index * 200);
            });
        };

        runCycle();

        const cycleDuration = (leds.length * 200) + 1000;
        blinkInterval = setInterval(() => {
            if (appMode === 'demo') runCycle();
        }, cycleDuration);
    }

    function stopDemo() {
        if (blinkInterval) {
            clearInterval(blinkInterval);
            blinkInterval = null;
        }
        clearAllTimeouts();
    }


    // ─── ON / OFF ─────────────────────────────────────────────────────────────

    function turnAllLedsOn() {
        appMode = 'on';
        stopDemo();
        if (!svgDoc) return;

        Object.values(BOARD_LEDS).forEach(ledId => {
            const el = svgDoc.getElementById(ledId);
            if (!el) return;

            // Remove animação CSS de pulso no led-power para manter estado sólido
            if (ledId === 'led-power') {
                el.style.setProperty('animation', 'none', 'important');
            }

            if (el.classList.contains('led-green-yellow')) {
                setLedState(ledId, 'run');
            } else {
                setLedState(ledId, 'on');
            }
        });
    }

    function turnAllLedsOff() {
        appMode = 'off';
        stopDemo();
        if (!svgDoc) return;

        Object.values(BOARD_LEDS).forEach(ledId => {
            const el = svgDoc.getElementById(ledId);
            if (el) el.style.removeProperty('animation');
            setLedState(ledId, 'off');
        });
    }


    // ─── Injeção de estilos no SVG interno ───────────────────────────────────

    function injectStyles(doc) {
        const STYLESHEET_NAME = 'dendriForge-A11Y-Slate.css';

        // Verifica se o @import já foi injetado num <style> interno
        const alreadyInjectedInStyle = Array.from(doc.querySelectorAll('style'))
            .some(s => s.textContent.includes(STYLESHEET_NAME));

        // FIX #2 — envolve acesso a doc.styleSheets em try/catch para evitar SecurityError CORS
        let alreadyLinked = false;
        try {
            alreadyLinked = Array.from(doc.styleSheets)
                .some(sheet => sheet.href && sheet.href.includes(STYLESHEET_NAME));
        } catch (e) {
            console.warn('Não foi possível inspecionar styleSheets do SVG (possível restrição CORS):', e);
        }

        if (!alreadyInjectedInStyle && !alreadyLinked) {
            console.log(`Injetando ${STYLESHEET_NAME} no SVG...`);
            // FIX #1 — usa createElement (HTML) em vez de createElementNS (SVG)
            // para que @import seja processado corretamente pelo parser CSS
            const styleEl = doc.createElement('style');
            styleEl.textContent = `@import url("${STYLESHEET_NAME}");`;
            doc.documentElement.appendChild(styleEl);
        }

        // Estilo de cursor para elementos interativos com data-pin
        if (!doc.getElementById('pin-cursor-style')) {
            const cursorStyle = doc.createElement('style');
            cursorStyle.id = 'pin-cursor-style';
            cursorStyle.textContent = `[data-pin] { cursor: pointer; }`;
            doc.documentElement.appendChild(cursorStyle);
        }
    }


    // ─── Inicialização ────────────────────────────────────────────────────────

    function initializeLeds(doc) {
        if (!doc || !doc.documentElement) {
            console.warn('initializeLeds chamada com documento inválido');
            return;
        }

        svgDoc = doc;

        // FIX #6 — limpa o mapa de LEDs antes de repopular,
        // evita acumulação em caso de reload do <object>
        Object.keys(BOARD_LEDS).forEach(k => delete BOARD_LEDS[k]);

        injectStyles(svgDoc);

        const elements = svgDoc.querySelectorAll('[id^="led-"]');
        console.log(`LEDs encontrados: ${elements.length}`);

        elements.forEach(el => {
            const key = el.id.replace(/^led-/, '').replace(/-/g, '_').toUpperCase();
            BOARD_LEDS[key] = el.id;
        });

        console.log('Mapa de LEDs:', BOARD_LEDS);

        // FIX #7 — remove listener de click anterior no SVG antes de adicionar novo,
        // evita handlers duplicados se initializeLeds for chamada mais do que uma vez
        if (svgClickHandler) {
            svgDoc.removeEventListener('click', svgClickHandler);
        }

        svgClickHandler = (e) => {
            if (appMode !== 'off') return;

            const pinElement = e.target.closest('[data-pin]');
            if (!pinElement) return;

            const pinValue = pinElement.getAttribute('data-pin');
            if (!pinValue) return;

            const ledEl = svgDoc.querySelector(`[data-linked-pin="${pinValue}"]`);
            if (!ledEl) return;

            const ledId = ledEl.id;
            const currentState = ledEl.dataset.state;

            if (currentState === 'on' || currentState === 'run') {
                setLedState(ledId, 'off');
            } else {
                setLedState(ledId, ledEl.classList.contains('led-green-yellow') ? 'run' : 'on');
            }
        };

        svgDoc.addEventListener('click', svgClickHandler);

        // Inicia o demo automaticamente após carregamento
        startDemo();
    }


    // ─── Bootstrapping ────────────────────────────────────────────────────────

    // FIX #7 — listeners dos botões HTML ficam fora de initializeLeds,
    // são registados uma única vez, independentemente de reloads do SVG
    document.getElementById('btn-on').addEventListener('click', turnAllLedsOn);
    document.getElementById('btn-off').addEventListener('click', turnAllLedsOff);
    document.getElementById('btn-demo').addEventListener('click', startDemo);

    function isSvgLoaded(board) {
        try {
            const doc = board.contentDocument;
            return doc &&
                doc.documentElement &&
                doc.documentElement.tagName.toLowerCase() === 'svg';
        } catch (e) {
            return false;
        }
    }

    const boardObj = document.getElementById('board');

    if (boardObj) {
        // FIX #8 — handler de erro explícito para falha de carregamento do SVG
        boardObj.addEventListener('error', () => {
            console.error('Falha ao carregar o SVG:', boardObj.data);
        });

        if (isSvgLoaded(boardObj)) {
            initializeLeds(boardObj.contentDocument);
        } else {
            boardObj.addEventListener('load', function () {
                initializeLeds(this.contentDocument);
            });
        }
    } else {
        console.error('Elemento #board não encontrado no DOM.');
    }
</script>

</html>
